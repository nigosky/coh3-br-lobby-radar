name: CoH3 Brasil — Radar de Lobby Ao Vivo

on:
  schedule:
    # Fallback de auto-recuperacao: caso a cadeia autonoma seja pausada manualmente, o cron religa sozinho
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  push:
    branches:
      - main
    paths:
      - "**.py"
      - "assets/**"
      - ".github/workflows/**"
  repository_dispatch:
    types:
      - sync-lobby-radar
  workflow_dispatch:
    inputs:
      force_sync:
        description: "Forcar atualizacao imediata do card no 1o ciclo?"
        required: false
        default: false
        type: boolean
      auto_relay:
        description: "Manter cadeia autonoma de ciclos de 5 min ativa (1h por sessao)?"
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: coh3-br-lobby-radar-state
  cancel-in-progress: false

jobs:
  sync-lobby-radar:
    if: github.repository == 'nigosky/coh3-br-lobby-radar' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout seguro (SHA imutavel)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Garantir renderizador grafico (apt oficial assinado GPG, zero pip)
        run: |
          set -euo pipefail
          NEED_PKGS=()
          if ! python3 -c "from PIL import Image, ImageDraw, ImageFont" >/dev/null 2>&1; then
            NEED_PKGS+=("python3-pil")
          fi
          if [ ! -d "/usr/share/fonts/truetype/dejavu" ]; then
            NEED_PKGS+=("fonts-dejavu-core" "fonts-liberation")
          fi
          if [ "${#NEED_PKGS[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${NEED_PKGS[@]}"
          fi

      - name: Validar suite de precisao e seguranca (anti-falso-positivo / anti-XXE)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m unittest discover -s . -p "test_*.py"

      - name: Sincronizar Radar a cada 5 min (sessao de 12 ciclos = 60 min)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          DISCORD_LOBBY_WEBHOOK_URL: ${{ secrets.DISCORD_LOBBY_WEBHOOK_URL }}
          FORCE_SYNC: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_sync) || false }}
          RELAY_ENABLED_VAR: ${{ vars.RADAR_AUTO_RELAY_ENABLED }}
          RELAY_CYCLES_VAR: ${{ vars.RADAR_RELAY_CYCLES }}
          AUTO_RELAY_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.auto_relay }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_LOBBY_WEBHOOK_URL:-}" ]; then
            echo "::notice::Secret DISCORD_LOBBY_WEBHOOK_URL ainda nao configurado em Settings -> Secrets and variables -> Actions."
            exit 0
          fi

          # Validacao numerica estrita [1..24] (padrao 12 ciclos = 60 min)
          CYCLES=12
          if [[ "${RELAY_CYCLES_VAR:-}" =~ ^[0-9]+$ ]] && [ "${RELAY_CYCLES_VAR}" -ge 1 ] && [ "${RELAY_CYCLES_VAR}" -le 24 ]; then
            CYCLES="${RELAY_CYCLES_VAR}"
          fi
          if [ "${RELAY_ENABLED_VAR:-true}" = "false" ]; then
            CYCLES=1
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${AUTO_RELAY_INPUT:-true}" = "false" ]; then
            CYCLES=1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for ((cycle=1; cycle<=CYCLES; cycle++)); do
            CYCLE_START="$(date +%s)"
            if [ "${cycle}" -gt 1 ]; then
              git pull --rebase --autostash origin main || git rebase --abort 2>/dev/null || true
            fi
            ARGS=()
            if [ "${cycle}" -eq 1 ]; then
              ARGS+=(--verify-webhook)
              if [ "${FORCE_SYNC}" = "true" ]; then
                ARGS+=(--force)
              fi
            fi

            python3 lobby_radar.py "${ARGS[@]}"

            # Persiste state.json e br_community.json imediatamente apos cada ciclo alterado
            if ! grep -RInEi "(ptb\.|canary\.)?discord(app)?\.com/api/(v[0-9]+/)?webhooks/[0-9]+" state.json br_community.json *.py 2>/dev/null; then
              for f in state.json br_community.json; do
                if [ -f "${f}" ]; then
                  git add -- "${f}"
                fi
              done
              if ! git diff --cached --quiet; then
                git commit -m "chore(lobby-state): atualizar estado do Radar de Lobby [skip ci]"
                git pull --rebase -X theirs origin main || git rebase --abort 2>/dev/null || true
                git push origin "HEAD:main" || true
              fi
            fi

            if [ "${cycle}" -lt "${CYCLES}" ]; then
              NOW_EPOCH="$(date +%s)"
              ELAPSED="$((NOW_EPOCH - CYCLE_START))"
              SLEEP_SEC="$((300 - ELAPSED))"
              if [ "${SLEEP_SEC}" -lt 5 ]; then
                SLEEP_SEC=5
              fi
              echo "[RADAR LOOP] Ciclo ${cycle}/${CYCLES} concluido em ${ELAPSED}s; proximo ciclo em ${SLEEP_SEC}s."
              sleep "${SLEEP_SEC}"
            fi
          done

      - name: Auditoria anti-vazamento e persistencia de estado (state.json + br_community.json)
        if: always()
        run: |
          set -euo pipefail

          # Bloqueia qualquer URL de Webhook em arquivos rastreados antes de qualquer git commit/push
          if grep -RInEi "(ptb\.|canary\.)?discord(app)?\.com/api/(v[0-9]+/)?webhooks/[0-9]+" state.json br_community.json *.py 2>/dev/null; then
            echo "::error::Bloqueio de seguranca acionado: padrao de URL de Webhook detectado em arquivo rastreado!"
            exit 1
          fi

          for f in state.json br_community.json; do
            if [ -f "${f}" ]; then
              git add -- "${f}"
            fi
          done

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao em state.json / br_community.json nesta sessao."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(lobby-state): atualizar estado do Radar de Lobby [skip ci]"
            for attempt in 1 2 3; do
              # Na estrategia --rebase, 'theirs' representa o commit local sendo re-aplicado (nosso estado mais recente!)
              git pull --rebase -X theirs origin main || {
                git rebase --abort 2>/dev/null || true
              }
              if git push origin "HEAD:main"; then
                echo "Estado salvo com sucesso em main."
                break
              fi
              sleep 2
            done
          fi

      - name: Auto-agendar proxima sessao autonoma (Relay seguro via GITHUB_TOKEN efemero)
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELAY_ENABLED_VAR: ${{ vars.RADAR_AUTO_RELAY_ENABLED }}
          AUTO_RELAY_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.auto_relay }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "${RELAY_ENABLED_VAR:-true}" = "false" ]; then
            echo "Kill-switch RADAR_AUTO_RELAY_ENABLED=false ativo; cadeia autonoma encerrada com seguranca."
            exit 0
          fi
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${AUTO_RELAY_INPUT:-true}" = "false" ]; then
            echo "Execucao unica solicitada (auto_relay=false); nao agendando proxima sessao."
            exit 0
          fi

          # Dupla checagem anti-duplicidade: se ja houver outro run queued/in_progress na fila, nao empilha outro!
          PENDING_COUNT="$(gh api 'repos/nigosky/coh3-br-lobby-radar/actions/workflows/radar_sync.yml/runs?per_page=10' \
            --jq '[.workflow_runs[] | select((.status == "queued" or .status == "in_progress" or .status == "waiting") and (.id != '"${GITHUB_RUN_ID}"'))] | length')"

          if [ "${PENDING_COUNT:-0}" -gt 0 ]; then
            echo "Ja existe ${PENDING_COUNT} sessao pendente/em andamento; evitando disparo duplicado."
            exit 0
          fi

          gh workflow run radar_sync.yml \
            --repo nigosky/coh3-br-lobby-radar \
            --ref main \
            -f force_sync=false \
            -f auto_relay=true
          echo "Proxima sessao autonoma de 60 min agendada com sucesso via GITHUB_TOKEN efemero!"
