name: CoH3 Brasil — Radar de Lobby Ao Vivo

on:
  schedule:
    # Fallback de auto-recuperacao: caso a cadeia autonoma seja pausada manualmente, o cron religa sozinho
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  push:
    branches:
      - main
    paths:
      - "**.py"
      - "players_roster.json"
      - "suspected_foreign_br.json"
      - "assets/**"
      - ".github/workflows/**"
  repository_dispatch:
    types:
      - sync-lobby-radar
  workflow_dispatch:
    inputs:
      force_sync:
        description: "Forcar atualizacao imediata do card no 1o ciclo?"
        required: false
        default: false
        type: boolean
      auto_relay:
        description: "Manter cadeia autonoma de ciclos de 5 min ativa (1h por sessao)?"
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: coh3-br-lobby-radar-state
  cancel-in-progress: false

jobs:
  sync-lobby-radar:
    if: github.repository == 'nigosky/coh3-br-lobby-radar' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
      actions: write
    env:
      SECRET_PATTERN: "(ptb\\.|canary\\.)?discord(app)?\\.com/api/(v[0-9]+/)?webhooks/[0-9]+|STEAM_WEB_API_KEY=[A-Za-z0-9]{16,}|x-webapi-key[:=][[:space:]]*[A-Za-z0-9]{16,}|[?&]key=[A-Za-z0-9]{16,}|TRACKER_DISPATCH_TOKEN=[A-Za-z0-9_.-]{16,}|Authorization:[[:space:]]*(Bearer|Basic|Token)[[:space:]]+[A-Za-z0-9._-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----"

    steps:
      - name: Checkout seguro (SHA imutavel)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: Restaurar estado intermediario do GitHub Actions Cache (privado)
        id: restore_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/radar_state_cache
          key: radar-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            radar-state-v1-

      - name: Garantir renderizador grafico (apt oficial assinado GPG, zero pip)
        run: |
          set -euo pipefail
          APT_OPTS=(-o Acquire::ForceIPv4=true -o Acquire::http::Timeout=25 -o Acquire::Retries=2)
          NEED_PKGS=()
          if ! python3 -c "from PIL import Image, ImageDraw, ImageFont" >/dev/null 2>&1; then
            NEED_PKGS+=("python3-pil")
          fi
          if [ ! -d "/usr/share/fonts/truetype/dejavu" ]; then
            NEED_PKGS+=("fonts-dejavu-core" "fonts-liberation")
          fi
          if [ ! -d "/usr/share/fonts/truetype/roboto" ]; then
            NEED_PKGS+=("fonts-roboto")
          fi
          NEED_CJK=0
          if [ -z "$(find /usr/share/fonts \( -iname '*NotoSansCJK*' -o -iname 'wqy-*.ttc' \) -print -quit 2>/dev/null)" ]; then
            NEED_CJK=1
          fi
          if [ "${#NEED_PKGS[@]}" -gt 0 ] || [ "${NEED_CJK}" -eq 1 ]; then
            sudo apt-get "${APT_OPTS[@]}" update -qq
          fi
          if [ "${#NEED_PKGS[@]}" -gt 0 ]; then
            sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends "${NEED_PKGS[@]}"
          fi
          if [ "${NEED_CJK}" -eq 1 ]; then
            timeout 90 sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends fonts-wqy-microhei \
              || timeout 90 sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends fonts-wqy-zenhei \
              || timeout 120 sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends fonts-noto-cjk \
              || { echo "::error::Nenhuma fonte CJK oficial (wqy-microhei/wqy-zenhei/noto-cjk) disponivel via apt."; exit 1; }
          fi

      - name: Validar suite de precisao e seguranca (anti-falso-positivo / anti-XXE)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -c "import sys, card_renderer as cr; ok, info = cr.verify_cjk_font_rendering(); print(f'[CJK CHECK] ok={ok} ({info})'); sys.exit(0 if ok else 1)"
          python3 manage_roster.py validate
          python3 -m unittest discover -s . -p "test_*.py"

      - name: Mesclar estado restaurado do Actions Cache com baseline da main
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/radar_state_cache"
          if [ -f "state.json" ] && [ ! -L "state.json" ]; then
            cp -f -- state.json "${RUNNER_TEMP}/git_baseline_state.json"
          else
            printf '{}\n' > "${RUNNER_TEMP}/git_baseline_state.json"
          fi
          python3 lobby_radar.py --merge-cache-dir "${RUNNER_TEMP}/radar_state_cache"

      - name: Sincronizar Radar a cada 5 min (sessao de 12 ciclos = 60 min, sem git push intermediario)
        id: sync
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          DISCORD_LOBBY_WEBHOOK_URL: ${{ secrets.DISCORD_LOBBY_WEBHOOK_URL }}
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
          FORCE_SYNC: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_sync) || false }}
          RELAY_ENABLED_VAR: ${{ vars.RADAR_AUTO_RELAY_ENABLED }}
          RELAY_CYCLES_VAR: ${{ vars.RADAR_RELAY_CYCLES }}
          AUTO_RELAY_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.auto_relay }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_LOBBY_WEBHOOK_URL:-}" ]; then
            echo "::notice::Secret DISCORD_LOBBY_WEBHOOK_URL ainda nao configurado em Settings -> Secrets and variables -> Actions."
            exit 0
          fi

          # Validacao numerica estrita [1..24] (padrao 12 ciclos = 60 min)
          CYCLES=12
          if [[ "${RELAY_CYCLES_VAR:-}" =~ ^[0-9]+$ ]] && [ "${RELAY_CYCLES_VAR}" -ge 1 ] && [ "${RELAY_CYCLES_VAR}" -le 24 ]; then
            CYCLES="${RELAY_CYCLES_VAR}"
          fi
          if [ "${RELAY_ENABLED_VAR:-true}" = "false" ]; then
            CYCLES=1
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${AUTO_RELAY_INPUT:-true}" = "false" ]; then
            CYCLES=1
          fi

          for ((cycle=1; cycle<=CYCLES; cycle++)); do
            CYCLE_START="$(date +%s)"
            ARGS=()
            if [ "${cycle}" -eq 1 ]; then
              ARGS+=(--verify-webhook)
              if [ "${FORCE_SYNC}" = "true" ]; then
                ARGS+=(--force)
              fi
            fi

            python3 lobby_radar.py "${ARGS[@]}"

            # Bloqueia imediatamente qualquer vazamento de Webhook/token/chave privada em arquivos rastreados (sem imprimir conteudo)
            matched="$(git ls-files -z | xargs -0 grep -IlEi "${SECRET_PATTERN}" 2>/dev/null | tr '\n' ' ' | sed 's/ *$//' || true)"
            if [ -n "${matched}" ]; then
              echo "::error::Bloqueio de seguranca acionado: segredo/Webhook detectado em arquivo rastreado (${matched})!"
              exit 1
            fi

            if [ "${cycle}" -lt "${CYCLES}" ]; then
              NOW_EPOCH="$(date +%s)"
              ELAPSED="$((NOW_EPOCH - CYCLE_START))"
              SLEEP_SEC="$((300 - ELAPSED))"
              if [ "${SLEEP_SEC}" -lt 5 ]; then
                SLEEP_SEC=5
              fi
              echo "[RADAR LOOP] Ciclo ${cycle}/${CYCLES} concluido em ${ELAPSED}s; proximo ciclo em ${SLEEP_SEC}s."
              sleep "${SLEEP_SEC}"
            fi
          done

      - name: Preparar snapshot de estado para Actions Cache (auditoria anti-vazamento e JSON)
        id: prep_cache
        if: always()
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          matched="$(git ls-files -z | xargs -0 grep -IlEi "${SECRET_PATTERN}" 2>/dev/null | tr '\n' ' ' | sed 's/ *$//' || true)"
          if [ -n "${matched}" ]; then
            echo "::error::Bloqueio de seguranca acionado: padrao de segredo/Webhook detectado antes do cache (${matched})!"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/radar_state_cache"
          COPIED=0
          for f in state.json br_community.json alias_history.json; do
            if [ -f "${f}" ] && [ ! -L "${f}" ]; then
              if ! python3 -m json.tool "${f}" >/dev/null; then
                echo "::error::Bloqueio de integridade: JSON corrompido em ${f}!"
                exit 1
              fi
              cp -f -- "${f}" "${RUNNER_TEMP}/radar_state_cache/${f}"
              COPIED=$((COPIED + 1))
            fi
          done
          if [ "${COPIED}" -gt 0 ]; then
            echo "has_snapshot=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_snapshot=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Salvar estado intermediario no GitHub Actions Cache (privado, zero PushEvent)
        if: always() && steps.prep_cache.outcome == 'success' && steps.prep_cache.outputs.has_snapshot == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/radar_state_cache
          key: radar-state-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Checkpoint condicional na main (apenas mudanca de Veteranos/Painel ou a cada 6h)
        if: always() && steps.prep_cache.outcome == 'success' && steps.prep_cache.outputs.has_snapshot == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          FORCE_SYNC: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_sync) || false }}
          CHECKPOINT_SEC_VAR: ${{ vars.RADAR_GIT_CHECKPOINT_SEC }}
        run: |
          set -euo pipefail

          # Bloqueia qualquer URL de Webhook, chave Steam, token GitHub/dispatch ou chave privada em TODOS os arquivos rastreados
          matched="$(git ls-files -z | xargs -0 grep -IlEi "${SECRET_PATTERN}" 2>/dev/null | tr '\n' ' ' | sed 's/ *$//' || true)"
          if [ -n "${matched}" ]; then
            echo "::error::Bloqueio de seguranca acionado: padrao de segredo/Webhook detectado em arquivo rastreado (${matched})!"
            exit 1
          fi

          CHECKPOINT_SEC=21600
          if [[ "${CHECKPOINT_SEC_VAR:-}" =~ ^[0-9]+$ ]] && [ "${CHECKPOINT_SEC_VAR}" -ge 300 ] && [ "${CHECKPOINT_SEC_VAR}" -le 86400 ]; then
            CHECKPOINT_SEC="${CHECKPOINT_SEC_VAR}"
          fi

          CKPT_ARGS=(--check-git-checkpoint "${RUNNER_TEMP}/git_baseline_state.json" --checkpoint-interval-sec "${CHECKPOINT_SEC}")
          if [ "${FORCE_SYNC}" = "true" ]; then
            CKPT_ARGS+=(--force)
          fi

          set +e
          CKPT_OUT="$(python3 lobby_radar.py "${CKPT_ARGS[@]}")"
          CKPT_RC=$?
          set -e
          echo "[GIT CHECKPOINT] ${CKPT_OUT}"
          if [ "${CKPT_RC}" -eq 10 ]; then
            echo "Push na main economizado: estado persistido apenas no GitHub Actions Cache privado."
            exit 0
          elif [ "${CKPT_RC}" -ne 0 ]; then
            echo "::error::Erro ao avaliar checkpoint git (rc=${CKPT_RC})."
            exit "${CKPT_RC}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PUSH_OK=0
          for attempt in 1 2 3; do
            git fetch --depth=1 origin main
            git reset --hard origin/main
            python3 lobby_radar.py --merge-cache-dir "${RUNNER_TEMP}/radar_state_cache"

            matched="$(git ls-files -z | xargs -0 grep -IlEi "${SECRET_PATTERN}" 2>/dev/null | tr '\n' ' ' | sed 's/ *$//' || true)"
            if [ -n "${matched}" ]; then
              echo "::error::Bloqueio de seguranca acionado apos merge: padrao de segredo detectado (${matched})!"
              exit 1
            fi

            for f in state.json br_community.json alias_history.json; do
              if [ -f "${f}" ] && [ ! -L "${f}" ]; then
                git add -- "${f}"
              fi
            done

            if git diff --cached --name-only | grep -Ei "(^\.env|\.secret$)" >/dev/null 2>&1; then
              echo "::error::Bloqueio de seguranca acionado: arquivo de segredo staged!"
              exit 1
            fi

            if git diff --cached --quiet; then
              echo "Nenhuma alteracao pendente para checkpoint na main."
              PUSH_OK=1
              break
            fi

            git commit -m "chore(lobby-state): checkpoint de estado do Radar de Lobby [skip ci]"
            if git push origin "HEAD:main"; then
              echo "Checkpoint salvo com sucesso em main (tentativa ${attempt}/3)."
              PUSH_OK=1
              break
            fi
            sleep $((attempt * 2))
          done

          if [ "${PUSH_OK}" -ne 1 ]; then
            echo "::error::Falha ao persistir checkpoint do Radar em main apos 3 tentativas!"
            exit 1
          fi

      - name: Auto-agendar proxima sessao autonoma (Relay seguro via GITHUB_TOKEN efemero)
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELAY_ENABLED_VAR: ${{ vars.RADAR_AUTO_RELAY_ENABLED }}
          AUTO_RELAY_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.auto_relay }}
          EVENT_NAME: ${{ github.event_name }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        run: |
          set -euo pipefail

          if [ "${RELAY_ENABLED_VAR:-true}" = "false" ]; then
            echo "Kill-switch RADAR_AUTO_RELAY_ENABLED=false ativo; cadeia autonoma encerrada com seguranca."
            exit 0
          fi
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${AUTO_RELAY_INPUT:-true}" = "false" ]; then
            echo "Execucao unica solicitada (auto_relay=false); nao agendando proxima sessao."
            exit 0
          fi

          if [ "${SYNC_OUTCOME:-}" != "success" ]; then
            echo "::warning::Sessao encerrou com status '${SYNC_OUTCOME:-unknown}'; aguardando 120s antes do self-relay para evitar loop rapido de falhas."
            sleep 120
          fi

          if ! [[ "${GITHUB_RUN_ID:-}" =~ ^[0-9]+$ ]]; then
            echo "::error::GITHUB_RUN_ID invalido."
            exit 1
          fi

          # Dupla checagem anti-duplicidade: se ja houver outro run queued/in_progress na fila, nao empilha outro!
          PENDING_COUNT="$(gh api 'repos/nigosky/coh3-br-lobby-radar/actions/workflows/radar_sync.yml/runs?per_page=10' \
            --jq '[.workflow_runs[] | select((.status == "queued" or .status == "in_progress" or .status == "waiting") and (.id != '"${GITHUB_RUN_ID}"'))] | length')"

          if [ "${PENDING_COUNT:-0}" -gt 0 ]; then
            echo "Ja existe ${PENDING_COUNT} sessao pendente/em andamento; evitando disparo duplicado."
            exit 0
          fi

          gh workflow run radar_sync.yml \
            --repo nigosky/coh3-br-lobby-radar \
            --ref main \
            -f force_sync=false \
            -f auto_relay=true
          echo "Proxima sessao autonoma de 60 min agendada com sucesso via GITHUB_TOKEN efemero!"
