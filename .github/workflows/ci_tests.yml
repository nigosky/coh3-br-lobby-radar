name: CI — Testes Automatizados e Segurança

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout seguro (SHA imutavel)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Pillow e fontes oficiais (apt GPG, zero pip)
        run: |
          set -euo pipefail
          APT_OPTS=(-o Acquire::ForceIPv4=true -o Acquire::http::Timeout=25 -o Acquire::Retries=2)
          NEED_PKGS=()
          if ! python3 -c "from PIL import Image, ImageDraw, ImageFont" >/dev/null 2>&1; then
            NEED_PKGS+=("python3-pil")
          fi
          if [ ! -d "/usr/share/fonts/truetype/dejavu" ]; then
            NEED_PKGS+=("fonts-dejavu-core" "fonts-liberation")
          fi
          if [ ! -d "/usr/share/fonts/truetype/roboto" ]; then
            NEED_PKGS+=("fonts-roboto")
          fi
          if [ "${#NEED_PKGS[@]}" -gt 0 ]; then
            sudo apt-get "${APT_OPTS[@]}" update -qq
            sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends "${NEED_PKGS[@]}"
          fi

      - name: Validar sintaxe, roster compartilhado e suite de testes
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m py_compile *.py
          python3 manage_roster.py validate
          python3 -m unittest discover -s . -p "test_*.py" -v
