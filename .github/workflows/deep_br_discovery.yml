name: CoH3 Brasil — Varredura Profunda Multi-Fonte (BR)

on:
  schedule:
    # Diariamente as 07:30 UTC (04:30 BRT), logo apos o COH3 Stats publicar leaderboards (04:00 UTC) e matches (06:00 UTC)
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      match_days:
        description: "Dias de dumps Open Data Matches (1 a 120; padrao diario 30)"
        required: false
        default: "30"
        type: string
      max_steam_verify:
        description: "Maximo de candidatos SA/squad verificados no XML Steam (0 a 1200)"
        required: false
        default: "750"
        type: string

permissions: {}

concurrency:
  group: coh3-br-deep-discovery
  cancel-in-progress: false

jobs:
  deep-br-discovery:
    if: github.repository == 'nigosky/coh3-br-lobby-radar' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write

    steps:
      - name: Checkout seguro (SHA imutavel)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Garantir dependencias Python oficiais (apt assinado GPG, zero pip)
        run: |
          set -euo pipefail
          APT_OPTS=(-o Acquire::ForceIPv4=true -o Acquire::http::Timeout=25 -o Acquire::Retries=2)
          NEED_PKGS=()
          if ! python3 -c "from PIL import Image, ImageDraw, ImageFont" >/dev/null 2>&1; then
            NEED_PKGS+=("python3-pil")
          fi
          if [ ! -d "/usr/share/fonts/truetype/dejavu" ]; then
            NEED_PKGS+=("fonts-dejavu-core" "fonts-liberation")
          fi
          if [ ! -d "/usr/share/fonts/truetype/roboto" ]; then
            NEED_PKGS+=("fonts-roboto")
          fi
          NEED_CJK=0
          if [ -z "$(find /usr/share/fonts \( -iname '*NotoSansCJK*' -o -iname 'wqy-*.ttc' \) -print -quit 2>/dev/null)" ]; then
            NEED_CJK=1
          fi
          if [ "${#NEED_PKGS[@]}" -gt 0 ] || [ "${NEED_CJK}" -eq 1 ]; then
            sudo apt-get "${APT_OPTS[@]}" update -qq
          fi
          if [ "${#NEED_PKGS[@]}" -gt 0 ]; then
            sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends "${NEED_PKGS[@]}"
          fi
          if [ "${NEED_CJK}" -eq 1 ]; then
            timeout 90 sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends fonts-wqy-microhei \
              || echo "::warning::Fonte CJK opcional (fonts-wqy-microhei) indisponivel no mirror Ubuntu; seguindo com fallback DejaVu."
          fi

      - name: Validar suite de precisao e seguranca (anti-falso-positivo / anti-XXE)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 manage_roster.py validate
          python3 -m unittest discover -s . -p "test_*.py"

      - name: Executar varredura profunda (COH3 Stats Open Data + Relic SA + Steam + CoHDB)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
          INPUT_MATCH_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.match_days || '30' }}
          INPUT_MAX_STEAM_VERIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.max_steam_verify || '750' }}
        run: |
          set -euo pipefail

          # Validacao numerica estrita contra injecao
          MATCH_DAYS=30
          if [[ "${INPUT_MATCH_DAYS:-}" =~ ^[0-9]+$ ]] && [ "${INPUT_MATCH_DAYS}" -ge 1 ] && [ "${INPUT_MATCH_DAYS}" -le 120 ]; then
            MATCH_DAYS="${INPUT_MATCH_DAYS}"
          fi

          MAX_STEAM_VERIFY=750
          if [[ "${INPUT_MAX_STEAM_VERIFY:-}" =~ ^[0-9]+$ ]] && [ "${INPUT_MAX_STEAM_VERIFY}" -ge 0 ] && [ "${INPUT_MAX_STEAM_VERIFY}" -le 1200 ]; then
            MAX_STEAM_VERIFY="${INPUT_MAX_STEAM_VERIFY}"
          fi

          python3 discover_br_community.py \
            --match-days "${MATCH_DAYS}" \
            --max-steam-verify "${MAX_STEAM_VERIFY}"

      - name: Validar suite de testes apos varredura profunda (bloqueia push quebrado em main)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 manage_roster.py validate
          python3 -m unittest discover -s . -p "test_*.py"

      - name: Auditoria anti-vazamento e persistencia (br_community.json + alias_history.json)
        run: |
          set -euo pipefail

          # Bloqueia qualquer URL de Webhook, chave Steam Web API, token GitHub/dispatch ou chave privada em TODOS os arquivos rastreados
          SECRET_PATTERN="(ptb\.|canary\.)?discord(app)?\.com/api/(v[0-9]+/)?webhooks/[0-9]+|STEAM_WEB_API_KEY=[A-Za-z0-9]{16,}|x-webapi-key[:=][[:space:]]*[A-Za-z0-9]{16,}|[?&]key=[A-Za-z0-9]{16,}|TRACKER_DISPATCH_TOKEN=[A-Za-z0-9_.-]{16,}|Authorization:[[:space:]]*(Bearer|Basic|Token)[[:space:]]+[A-Za-z0-9._-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----"
          matched="$(git ls-files -z | xargs -0 grep -IlEi "${SECRET_PATTERN}" 2>/dev/null | tr '\n' ' ' | sed 's/ *$//' || true)"
          if [ -n "${matched}" ]; then
            echo "::error::Bloqueio de seguranca acionado: padrao de segredo/Webhook detectado em arquivo rastreado (${matched})!"
            exit 1
          fi

          for f in br_community.json alias_history.json; do
            if [ -f "${f}" ] && [ ! -L "${f}" ]; then
              python3 -m json.tool "${f}" >/dev/null
              git add -- "${f}"
            fi
          done
          if git diff --cached --name-only | grep -Ei "(^\.env|\.secret$)" >/dev/null 2>&1; then
            echo "::error::Bloqueio de seguranca acionado: arquivo de segredo staged!"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao em br_community.json / alias_history.json nesta varredura profunda."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(br-discovery): convergir catalogo profundo de brasileiros ativos [skip ci]"

          for attempt in 1 2 3 4; do
            git pull --rebase -X theirs origin main || {
              git rebase --abort 2>/dev/null || true
            }
            if git push origin "HEAD:main"; then
              echo "Catalogo profundo e historico de nicks publicados com sucesso em main."
              break
            fi
            sleep 3
          done
