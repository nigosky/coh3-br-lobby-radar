name: CoH3 Brasil — Radar de Lobby Ao Vivo

on:
  schedule:
    # Repositorio publico (minutos 100% gratuitos): atualiza o Radar de Lobby a cada 5 min!
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    paths:
      - "**.py"
      - "assets/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      force_sync:
        description: "Forcar atualizacao imediata do Painel Vivo Fixo no Discord?"
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: coh3-br-lobby-radar-state
  cancel-in-progress: false

jobs:
  sync-lobby-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write

    steps:
      - name: Checkout seguro (SHA imutavel)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Garantir renderizador grafico (apt oficial assinado GPG, zero pip)
        run: |
          set -euo pipefail
          NEED_PKGS=()
          if ! python3 -c "from PIL import Image, ImageDraw, ImageFont" >/dev/null 2>&1; then
            NEED_PKGS+=("python3-pil")
          fi
          if [ ! -d "/usr/share/fonts/truetype/dejavu" ]; then
            NEED_PKGS+=("fonts-dejavu-core" "fonts-liberation")
          fi
          if [ "${#NEED_PKGS[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${NEED_PKGS[@]}"
          fi

      - name: Sincronizar Radar de Lobby Ao Vivo (Steam XML + Relic -> Discord)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          DISCORD_LOBBY_WEBHOOK_URL: ${{ secrets.DISCORD_LOBBY_WEBHOOK_URL }}
          FORCE_SYNC: ${{ inputs.force_sync }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_LOBBY_WEBHOOK_URL:-}" ]; then
            echo "::notice::Secret DISCORD_LOBBY_WEBHOOK_URL ainda nao configurado em Settings -> Secrets and variables -> Actions."
            exit 0
          fi

          ARGS=(--verify-webhook)
          if [ "${FORCE_SYNC:-false}" = "true" ]; then
            ARGS+=(--force)
          fi
          python3 lobby_radar.py "${ARGS[@]}"

      - name: Auditoria anti-vazamento e persistencia de estado (state.json)
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Bloqueia qualquer URL de Webhook em arquivos rastreados
          if grep -RInEi "(ptb\.|canary\.)?discord(app)?\.com/api/(v[0-9]+/)?webhooks/[0-9]+" state.json *.py 2>/dev/null; then
            echo "::error::Bloqueio de seguranca acionado: padrao de URL de Webhook detectado em arquivo rastreado!"
            exit 1
          fi

          if [ -f "state.json" ]; then
            git add -- state.json
          fi

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao em state.json neste ciclo."
          else
            BRANCH_NAME="${TARGET_BRANCH:-main}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(lobby-state): atualizar estado do Radar de Lobby [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin "${BRANCH_NAME}" || true
              if git push origin "HEAD:${BRANCH_NAME}"; then
                echo "Estado salvo com sucesso em ${BRANCH_NAME}."
                break
              fi
              sleep 2
            done
          fi
